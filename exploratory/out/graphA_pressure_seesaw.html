// Graph A: the Southern Oscillation (air-pressure seesaw) vs the Niño 3.4 index (D3 v7)
// DATA = {meta, map:{lat (north→south), lon, diff[[...]], land[[...]], n_nino, n_nina, lim},
//         sites:{tahiti:{lat,lon}, darwin:{lat,lon}},
//         time[], oni[], soi[], tahiti[], darwin[], phase[]}
const M = DATA.meta;
const root = d3.select("#root");
root.append("h2").text("When the ocean warms, the air-pressure seesaw tips");
root.append("p").attr("class", "sub").html(
  `<b>Top:</b> how air pressure at sea level differs between El Niño months and La Niña months across the Indian and Pacific Oceans. ` +
  `<b>Bottom:</b> the ocean signal (Niño 3.4 index) and the atmosphere signal (pressure at Tahiti minus pressure at Darwin) for every month, ` +
  `both as departures from their ${M.base} normal and smoothed over 3 months. ` +
  `${M.model} ${M.experiment} run (${M.member}), ${M.years}: real observed ocean temperatures, simulated atmosphere.`
);

const RED = "#e34948", BLUE = "#2a78d6", GRAY = "#c9c6bd";
const phaseColor = p => (p === "El Niño" ? RED : p === "La Niña" ? BLUE : GRAY);
const num = (v, u, d = 2) => (v == null ? "n/a" : (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d) + (u ? " " + u : ""));
const deg = v => (Math.abs(v) % 1 === 0 ? Math.abs(v) : Math.abs(v).toFixed(1));
const lonFmt = l => { l = ((l % 360) + 360) % 360; return Math.round(l) === 180 ? "180°" : l < 180 ? `${deg(l)}°E` : `${deg(360 - l)}°W`; };
const latFmt = l => (Math.abs(l) < 1e-9 ? "0°" : l > 0 ? `${deg(l)}°N` : `${deg(-l)}°S`);

const W = 880, ml = 52;
const mp = DATA.map, lat = mp.lat, lon = mp.lon, nlat = lat.length, nlon = lon.length;
const dlon = lon[1] - lon[0], dlat = Math.abs(lat[0] - lat[1]);
const pw = W - ml - 20, mapH = Math.round(pw * (nlat * dlat) / (nlon * dlon));
const cw = pw / nlon, ch = mapH / nlat;
const mapTop = 30;
const tTop = mapTop + mapH + 132, tw = 520, th = 118, tgap = 40;
const sLeft = ml + tw + 64, ss = W - sLeft - 16;
const H = tTop + 2 * th + tgap + 44;
const svg = root.append("svg").attr("viewBox", `0 0 ${W} ${H}`).attr("width", W).style("max-width", "100%").style("height", "auto");
const tip = d3.select("body").append("div").attr("class", "tip");

// ---------------- map ----------------
const L = mp.lim;
const pcolor = d3.scaleDiverging([-L, 0, L],
  d3.piecewise(d3.interpolateLab, ["#3d2a7a", "#6b5bc4", "#b9b0e6", "#f0efec", "#f2c38f", "#d9822b", "#8a4a0e"])).clamp(true);
const mg = svg.append("g").attr("transform", `translate(${ml},${mapTop})`);
mg.append("text").attr("y", -10).attr("class", "ptitle")
  .text(`Sea-level pressure in El Niño months minus La Niña months (${mp.n_nino} vs ${mp.n_nina} months)`);
const cells = [];
for (let i = 0; i < nlat; i++) for (let j = 0; j < nlon; j++) cells.push([i, j]);
mg.append("g").selectAll("rect").data(cells).join("rect")
  .attr("x", d => d[1] * cw).attr("y", d => d[0] * ch).attr("width", cw + 0.4).attr("height", ch + 0.4)
  .attr("fill", d => { const v = mp.diff[d[0]][d[1]]; return v == null ? "#f6f5f2" : pcolor(v); });
const coast = d3.contours().size([nlon, nlat]).thresholds([0.5])(mp.land.flat().map(v => (v == null ? 0 : v)));
mg.append("path").attr("d", d3.geoPath(d3.geoTransform({ point(x, y) { this.stream.point(x * cw, y * ch); } }))(coast[0]))
  .attr("fill", "none").attr("stroke", "#1f1e1c").attr("stroke-width", 0.8);
const mx = d3.scaleLinear([lon[0] - dlon / 2, lon[nlon - 1] + dlon / 2], [0, pw]);
const my = d3.scaleLinear([lat[0] + dlat / 2, lat[nlat - 1] - dlat / 2], [0, mapH]);
mg.append("g").attr("class", "axis").attr("transform", `translate(0,${mapH})`)
  .call(d3.axisBottom(mx).tickValues([60, 90, 120, 150, 180, 210, 240, 270].filter(t => t > mx.domain()[0] && t < mx.domain()[1])).tickFormat(lonFmt).tickSizeOuter(0));
mg.append("g").attr("class", "axis")
  .call(d3.axisLeft(my).tickValues([-30, -15, 0, 15, 30].filter(t => t <= my.domain()[0] && t >= my.domain()[1])).tickFormat(latFmt).tickSizeOuter(0));
Object.entries({ Tahiti: DATA.sites.tahiti, Darwin: DATA.sites.darwin }).forEach(([name, s]) => {
  mg.append("circle").attr("cx", mx(s.lon)).attr("cy", my(s.lat)).attr("r", 5)
    .attr("fill", "#fff").attr("stroke", "#1f1e1c").attr("stroke-width", 2);
  mg.append("text").attr("x", mx(s.lon) + 8).attr("y", my(s.lat) + 4).attr("class", "boxlab").text(name);
});
const mhl = mg.append("rect").attr("width", cw).attr("height", ch).attr("fill", "none").attr("stroke", "#1f1e1c").style("display", "none");
mg.append("rect").attr("width", pw).attr("height", mapH).attr("fill", "transparent")
  .on("mousemove", ev => {
    const [px, py] = d3.pointer(ev);
    const j = Math.max(0, Math.min(nlon - 1, Math.floor(px / cw))), i = Math.max(0, Math.min(nlat - 1, Math.floor(py / ch)));
    const v = mp.diff[i][j];
    mhl.style("display", null).attr("x", j * cw).attr("y", i * ch);
    showTip(ev, `<b>${latFmt(lat[i])}, ${lonFmt(lon[j])}</b><br>El Niño minus La Niña: ${num(v, "hPa")}<br>` +
      (v == null ? "" : v > 0 ? "Pressure is <b>higher</b> during El Niño" : "Pressure is <b>lower</b> during El Niño"));
  })
  .on("mouseleave", () => { mhl.style("display", "none"); hideTip(); });
// map legend
const lg = svg.append("g").attr("transform", `translate(${ml},${mapTop + mapH + 40})`);
const grad = svg.append("defs").append("linearGradient").attr("id", "gAgrad");
d3.range(0, 1.0001, 0.05).forEach(t => grad.append("stop").attr("offset", t).attr("stop-color", pcolor(-L + 2 * L * t)));
lg.append("rect").attr("width", 260).attr("height", 10).attr("fill", "url(#gAgrad)");
lg.append("g").attr("class", "axis").attr("transform", "translate(0,10)")
  .call(d3.axisBottom(d3.scaleLinear([-L, L], [0, 260])).ticks(5).tickFormat(v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v)).tickSizeOuter(0));
lg.append("text").attr("x", 274).attr("y", 9).text("hPa. Orange = higher pressure during El Niño, purple = lower. Black lines = coastlines.");

// ---------------- stacked timelines ----------------
const T = DATA.time, N = T.length, yr = i => +T[i].slice(0, 4), mo = i => +T[i].slice(5, 7);
const S = M.soi_lim;
const x = d3.scaleLinear([0, N], [0, tw]);
const y1 = d3.scaleLinear([-3, 3], [th, 0]).clamp(true);
const y2 = d3.scaleLinear([-S, S], [th, 0]).clamp(true);
const tg = svg.append("g").attr("transform", `translate(${ml},${tTop})`);
const key = tg.append("g").attr("transform", `translate(0,-50)`);
[["El Niño", RED], ["La Niña", BLUE], ["Neutral", GRAY]].forEach(([n, c], k) => {
  key.append("rect").attr("x", k * 90).attr("width", 11).attr("height", 11).attr("fill", c);
  key.append("text").attr("x", k * 90 + 16).attr("y", 10).text(n);
});
key.append("text").attr("x", 280).attr("y", 10).text("Bar color = month's phase (same in both panels)");
const panels = [
  { y: y1, v: DATA.oni, title: "Ocean: Niño 3.4 index (°C)", off: 0, ticks: [-2, 0, 2] },
  { y: y2, v: DATA.soi, title: "Atmosphere: Tahiti minus Darwin pressure (hPa)", off: th + tgap, ticks: [-Math.floor(S / 2) * 1, 0, Math.floor(S / 2)] },
];
panels.forEach(p => {
  const g = tg.append("g").attr("transform", `translate(0,${p.off})`);
  g.append("text").attr("y", -8).attr("class", "ptitle").text(p.title);
  g.append("g").selectAll("rect").data(p.v).join("rect")
    .attr("x", (_, i) => x(i)).attr("width", Math.max(tw / N, 0.6))
    .attr("y", v => (v == null ? 0 : p.y(Math.max(v, 0)))).attr("height", v => (v == null ? 0 : Math.abs(p.y(v) - p.y(0))))
    .attr("fill", (_, i) => phaseColor(DATA.phase[i]));
  g.append("line").attr("x2", tw).attr("y1", p.y(0)).attr("y2", p.y(0)).attr("stroke", "#888780").attr("stroke-width", 0.6);
  g.append("g").attr("class", "axis").call(d3.axisLeft(p.y).tickValues(p.ticks).tickFormat(v => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v)).tickSizeOuter(0));
});
const decades = d3.range(N).filter(i => mo(i) === 1 && yr(i) % 10 === 0);
tg.append("g").attr("class", "axis").attr("transform", `translate(0,${2 * th + tgap})`)
  .call(d3.axisBottom(x).tickValues(decades).tickFormat(i => yr(i)).tickSizeOuter(0));
const vline = tg.append("line").attr("y2", 2 * th + tgap).attr("stroke", "#1f1e1c").style("display", "none");
const brush = d3.brushX().extent([[0, 0], [tw, 2 * th + tgap]]).on("brush end", ev => {
  if (!ev.selection) { setSel(null); return; }
  const [a, b] = ev.selection.map(v => Math.max(0, Math.min(N, Math.round(x.invert(v)))));
  setSel(b - a >= 6 ? [a, b - 1] : null);
});
const gb = tg.append("g").attr("class", "brush").call(brush);
gb.on("mousemove.hover", ev => {
  const [px] = d3.pointer(ev, tg.node());
  const i = Math.max(0, Math.min(N - 1, Math.floor(x.invert(px))));
  vline.style("display", null).attr("x1", x(i + 0.5)).attr("x2", x(i + 0.5));
  ring.style("display", DATA.oni[i] == null || DATA.soi[i] == null ? "none" : null)
    .attr("cx", sx(DATA.oni[i] ?? 0)).attr("cy", sy(DATA.soi[i] ?? 0));
  showTip(ev, `<b>${T[i]}</b> · ${DATA.phase[i]}<br>Niño 3.4 index: ${num(DATA.oni[i], "°C")}<br>` +
    `Tahiti minus Darwin: ${num(DATA.soi[i], "hPa")}<br><span style="color:#6b6a65">Tahiti ${num(DATA.tahiti[i], "hPa")}, Darwin ${num(DATA.darwin[i], "hPa")} vs normal</span>`);
}).on("mouseleave.hover", () => { vline.style("display", "none"); ring.style("display", "none"); hideTip(); });

// ---------------- scatter ----------------
const sg = svg.append("g").attr("transform", `translate(${sLeft},${tTop})`);
const sx = d3.scaleLinear([-3, 3], [0, ss]).clamp(true), sy = d3.scaleLinear([-S, S], [ss, 0]).clamp(true);
sg.append("text").attr("y", -8).attr("class", "ptitle").text("Each month: ocean vs atmosphere");
sg.append("line").attr("x1", sx(0)).attr("x2", sx(0)).attr("y2", ss).attr("stroke", "#d3d1c7");
sg.append("line").attr("y1", sy(0)).attr("y2", sy(0)).attr("x2", ss).attr("stroke", "#d3d1c7");
const idx = d3.range(N).filter(i => DATA.oni[i] != null && DATA.soi[i] != null);
const dots = sg.append("g").selectAll("circle").data(idx).join("circle")
  .attr("cx", i => sx(DATA.oni[i])).attr("cy", i => sy(DATA.soi[i])).attr("r", 2.6)
  .attr("fill", i => phaseColor(DATA.phase[i]));
const ring = sg.append("circle").attr("r", 6).attr("fill", "none").attr("stroke", "#1f1e1c").attr("stroke-width", 1.5).style("display", "none");
sg.append("g").attr("class", "axis").attr("transform", `translate(0,${ss})`).call(d3.axisBottom(sx).ticks(5).tickSizeOuter(0));
sg.append("g").attr("class", "axis").call(d3.axisLeft(sy).ticks(5).tickSizeOuter(0));
sg.append("text").attr("x", ss / 2).attr("y", ss + 32).attr("text-anchor", "middle").text("Niño 3.4 index (°C) →  warmer ocean");
sg.append("text").attr("transform", `translate(-38,${ss / 2}) rotate(-90)`).attr("text-anchor", "middle").text("Tahiti − Darwin pressure (hPa)");
const rText = sg.append("text").attr("x", ss).attr("y", 14).attr("text-anchor", "end").attr("class", "boxlab");
const rSub = sg.append("text").attr("x", ss).attr("y", 28).attr("text-anchor", "end");

function corr(ids) {
  const a = ids.map(i => DATA.oni[i]), b = ids.map(i => DATA.soi[i]);
  const ma = d3.mean(a), mb = d3.mean(b);
  const num_ = d3.sum(a, (v, k) => (v - ma) * (b[k] - mb));
  return num_ / Math.sqrt(d3.sum(a, v => (v - ma) ** 2) * d3.sum(b, v => (v - mb) ** 2));
}
function setSel(w) {
  const ids = w ? idx.filter(i => i >= w[0] && i <= w[1]) : idx;
  dots.attr("opacity", i => (!w || (i >= w[0] && i <= w[1]) ? 0.8 : 0.08));
  rText.text(ids.length > 3 ? `r = ${corr(ids).toFixed(2)}` : "r = n/a");
  rSub.text(w ? `${T[w[0]]} to ${T[w[1]]} (${ids.length} months)` : `all ${ids.length} months`);
}
setSel(null);

root.append("p").attr("class", "note").html(
  "Hover the bars to read a month (its dot is circled on the right). <b>Drag across the bars</b> to pick a stretch of years; the scatter plot fades the other months and recalculates r. Click outside the shaded box to reset."
);

function showTip(ev, html) { tip.style("opacity", 1).style("left", (ev.pageX + 14) + "px").style("top", (ev.pageY + 10) + "px").html(html); }
function hideTip() { tip.style("opacity", 0); }

</script></body></html>
